    <rect x="0" y="18" width="390" height="14" fill="#141C26"/>
    <text x="16" y="22" fill="#8A96A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/jp</text>
    <text x="22" y="64" fill="#7EE0C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ whoami</text>
    <text x="22" y="90" fill="#E8E2D4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Juan Pablo Granados</text>
    <text x="22" y="124" fill="#7EE0C3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ role</text>
