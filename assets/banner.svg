  <rect x="10" y="10" width="1180" height="340" rx="18" fill="none" stroke="#2A3544" stroke-width="1.6"/>

  <rect x="10" y="10" width="1180" height="40" rx="18" fill="#0B1018"/>
  <rect x="10" y="28" width="1180" height="22" fill="#0B1018"/>
  <line x1="10" y1="50" x2="1190" y2="50" stroke="#2A3544" stroke-width="1.2"/>
  <circle cx="42" cy="30" r="6" fill="#E07A5F"/>
  <circle cx="64" cy="30" r="6" fill="#F0C27B"/>
