<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Juan Pablo Granados Coral — Datos e IA</title>
  <desc id="desc">Cabecera tecnica con monograma JP, stack (Python, SQL, AWS, RAG, Docker) y rol de Ingeniero de Datos e Inteligencia Artificial.</desc>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="52%" stop-color="#0E141C"/>
      <stop offset="100%" stop-color="#10161C"/>
    </linearGradient>
    <radialGradient id="lamp" cx="16%" cy="0%" r="58%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#D4A574" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phosphor" cx="88%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#7EE0C3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7EE0C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D09A"/>
      <stop offset="100%" stop-color="#C4894A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8A96A8" stroke-width="0.5" opacity="0.14"/>
    </pattern>
    <clipPath id="frame">
      <rect x="10" y="10" width="1180" height="340" rx="18"/>
    </clipPath>
    <style>
      .cursor { animation: blink 1.15s steps(1, end) infinite; }
      .node { animation: pulse 3.8s ease-in-out infinite; }
      .node2 { animation: pulse 3.8s ease-in-out infinite 0.7s; }
      .node3 { animation: pulse 3.8s ease-in-out infinite 1.4s; }
      .node4 { animation: pulse 3.8s ease-in-out infinite 2.1s; }
      .node5 { animation: pulse 3.8s ease-in-out infinite 2.8s; }
      @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .node, .node2, .node3, .node4, .node5 {
          animation: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

